<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soukis — Admin</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f6f7fb;color:#111827;margin:0}header{background:#0f172a;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#fff}header select{font:inherit;border-radius:10px;padding:7px}main{width:90%;max-width:1250px;margin:30px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.panel{margin-top:22px}.value{font-size:30px;font-weight:900;margin-top:5px}.row{padding:12px 0;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#6b7280}select,button,input{font:inherit;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;background:#fff}button{cursor:pointer;background:#0f172a;color:#fff}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#f1f5f9}.admin-order,.money-row{margin:10px 0;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.money-row{display:grid;gap:7px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#f1f5f9;font-size:.85rem}.admin-status-message{display:block;margin-top:8px;font-size:.9rem}@media(max-width:800px){.grid,.money-grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><strong>Soukis Admin</strong><div><select id="language" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select> <a href="index.html" id="store-link">العودة للمتجر</a></div></header>
<main>
<p id="admin-status" class="muted">جارٍ التحقق من الصلاحيات…</p>
<section id="dashboard" hidden>
<div class="grid"><div class="card"><div id="products-label" class="muted">المنتجات المعروضة</div><div id="products-count" class="value">—</div></div><div class="card"><div id="orders-label" class="muted">آخر الطلبات المحملة</div><div id="orders-count" class="value">—</div></div><div class="card"><div id="user-label" class="muted">المستخدم الحالي</div><div id="admin-email" class="value" style="font-size:16px">—</div></div></div>
<div class="panel"><h2 id="products-title">إدارة المنتجات</h2><div id="products-list" class="muted">جارٍ التحميل…</div></div>
<div class="panel"><h2 id="orders-title">إدارة الطلبات</h2><div id="orders-list" class="muted">جارٍ التحميل…</div></div>
<div class="panel"><h2 id="payments-title">المدفوعات</h2><div id="payments-list" class="muted">جارٍ التحميل…</div></div>
<div class="panel"><h2 id="promotions-title">طلبات الترويج</h2><div id="promotions-list" class="muted">جارٍ التحميل…</div></div>
<div class="panel"><h2 id="subscriptions-title">اشتراكات البائعين</h2><div id="subscriptions-list" class="muted">جارٍ التحميل…</div></div>
<div id="message" class="msg" hidden></div>
</section>
</main>
<script type="module">
import { db } from './supabase.js';
import { getAdminOrders, updateOrderStatus, getAdminMonetization, reviewPromotion } from './admin-service.js';
const status=document.getElementById('admin-status'),dashboard=document.getElementById('dashboard'),message=document.getElementById('message');
const texts={ar:{store:'العودة للمتجر',products:'المنتجات المعروضة',orders:'آخر الطلبات المحملة',user:'المستخدم الحالي',pt:'إدارة المنتجات',ot:'إدارة الطلبات',payments:'المدفوعات',promotions:'طلبات الترويج',subscriptions:'اشتراكات البائعين',loading:'جارٍ التحقق من الصلاحيات…',ok:'تم التحقق من صلاحيات Admin.',denied:'تم رفض الوصول أو تعذر تحميل البيانات.',none:'لا توجد بيانات',saved:'تم التحديث',fail:'تعذر التحديث',approve:'موافقة',reject:'رفض'},fr:{store:'Retour à la boutique',products:'Produits affichés',orders:'Commandes chargées',user:'Utilisateur actuel',pt:'Gestion des produits',ot:'Gestion des commandes',payments:'Paiements',promotions:'Demandes de promotion',subscriptions:'Abonnements vendeurs',loading:'Vérification des droits…',ok:'Droits Admin vérifiés.',denied:'Accès refusé ou données indisponibles.',none:'Aucune donnée',saved:'Mise à jour effectuée',fail:'Échec de la mise à jour',approve:'Approuver',reject:'Refuser'},en:{store:'Back to store',products:'Listed products',orders:'Loaded orders',user:'Current user',pt:'Product management',ot:'Order management',payments:'Payments',promotions:'Promotion requests',subscriptions:'Seller subscriptions',loading:'Checking permissions…',ok:'Admin permissions verified.',denied:'Access denied or data unavailable.',none:'No data',saved:'Updated',fail:'Update failed',approve:'Approve',reject:'Reject'}};
const statuses=['active','sold','hidden','pending'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=localStorage.getItem('soukis-language')||'ar';
function applyLang(){const t=texts[lang]||texts.ar;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').value=lang;document.getElementById('store-link').textContent=t.store;document.getElementById('products-label').textContent=t.products;document.getElementById('orders-label').textContent=t.orders;document.getElementById('user-label').textContent=t.user;document.getElementById('products-title').textContent=t.pt;document.getElementById('orders-title').textContent=t.ot;document.getElementById('payments-title').textContent=t.payments;document.getElementById('promotions-title').textContent=t.promotions;document.getElementById('subscriptions-title').textContent=t.subscriptions;}
function flash(text){message.textContent=text;message.hidden=false;setTimeout(()=>message.hidden=true,3000)}
async function loadProducts(){const {data,error}=await db.from('listings').select('id,title,price,currency,status,created_at').order('created_at',{ascending:false}).limit(20);if(error)throw error;document.getElementById('products-count').textContent=data?.length||0;const t=texts[lang]||texts.ar;document.getElementById('products-list').innerHTML=data?.length?data.map(p=>`<div class="row"><div><strong>${esc(p.title)}</strong><br><span class="muted">${esc(p.price)} ${esc(p.currency||'')}</span></div><select data-product="${esc(p.id)}" aria-label="Product status">${statuses.map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):t.none;document.querySelectorAll('[data-product]').forEach(el=>el.addEventListener('change',async()=>{const {error}=await db.from('listings').update({status:el.value}).eq('id',el.dataset.product);if(error){flash(t.fail);await loadProducts()}else flash(t.saved)}));}
async function loadOrders(){const result=await getAdminOrders();if(!result.ok)throw result.error||new Error('Admin access denied');document.getElementById('orders-count').textContent=result.orders.length;const labels={ar:{pending:'قيد الانتظار',confirmed:'مؤكد',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغى'},fr:{pending:'En attente',confirmed:'Confirmée',shipped:'Expédiée',completed:'Terminée',cancelled:'Annulée'},en:{pending:'Pending',confirmed:'Confirmed',shipped:'Shipped',completed:'Completed',cancelled:'Cancelled'}}[lang]||{};const allowed=Object.keys(labels);document.getElementById('orders-list').innerHTML=result.orders.length?result.orders.map(o=>`<div class="admin-order" data-order="${esc(o.id)}"><strong>#${esc(o.id)}</strong><div>${esc(o.shipping_name||'—')} · ${esc(o.total)} ${esc(o.currency||'')}</div><select class="order-status">${allowed.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${labels[s]}</option>`).join('')}</select></div>`).join(''):texts[lang].none;document.querySelectorAll('.order-status').forEach(el=>el.addEventListener('change',async()=>{const result=await updateOrderStatus(el.closest('[data-order]').dataset.order,el.value);if(!result.ok)flash(texts[lang].fail);else flash(texts[lang].saved)}));}
async function loadMonetization(){const r=await getAdminMonetization();if(!r.ok)throw r.error||new Error('Admin access denied');const t=texts[lang];document.getElementById('payments-list').innerHTML=r.payments.length?r.payments.map(p=>`<div class="money-row"><div><strong>${esc(p.plan)}</strong> <span class="badge">${esc(p.status)}</span></div><div>${esc(p.amount_dzd)} ${esc(p.currency||'DZD')} · ${esc(p.payment_method||p.payment_provider||'—')}</div><small>${esc(p.user_id)} · ${esc(p.listing_id||'—')} · ${esc(p.created_at)}</small></div>`).join(''):t.none;document.getElementById('promotions-list').innerHTML=r.promotions.length?r.promotions.map(p=>`<div class="money-row"><div><strong>${esc(p.promotion_type)}</strong> <span class="badge">${esc(p.status)}</span></div><div>${esc(p.listing_id)} · ${esc(p.user_id)} · ${esc(p.created_at)}</div>${p.status==='pending'?`<div><button data-review="approve" data-id="${esc(p.id)}">${t.approve}</button> <button data-review="reject" data-id="${esc(p.id)}">${t.reject}</button></div>`:''}</div>`).join(''):t.none;document.getElementById('subscriptions-list').innerHTML=r.subscriptions.length?r.subscriptions.map(s=>`<div class="money-row"><div><strong>${esc(s.plan)}</strong> <span class="badge">${esc(s.status)}</span></div><div>${esc(s.user_id)} · ${esc(s.starts_at||'—')} → ${esc(s.ends_at||'—')}</div></div>`).join(''):t.none;document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const result=await reviewPromotion(b.dataset.id,b.dataset.review==='approve'?'approved':'rejected');if(!result.ok)flash(t.fail);else{flash(t.saved);await loadMonetization()}}));}
async function load(){await Promise.all([loadProducts(),loadOrders(),loadMonetization()]);}
document.getElementById('language').addEventListener('change',async e=>{lang=e.target.value;localStorage.setItem('soukis-language',lang);applyLang();try{await load()}catch(e){console.error(e)}});applyLang();
try{const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Access denied');const {data:isAdmin,error}=await db.rpc('is_admin');if(error||isAdmin!==true)throw new Error('Access denied');document.getElementById('admin-email').textContent=user.email||'Admin';await load();status.textContent=(texts[lang]||texts.ar).ok;dashboard.hidden=false}catch(e){status.textContent=(texts[lang]||texts.ar).denied;console.error(e)}
</script></body></html>
