<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soukis — Admin</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f6f7fb;color:#111827;margin:0}header{background:#0f172a;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#fff}header select{font:inherit;border-radius:10px;padding:7px}main{width:90%;max-width:1200px;margin:30px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.panel{margin-top:22px}.value{font-size:30px;font-weight:900;margin-top:5px}.row{padding:12px 0;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#6b7280}select,button{font:inherit;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;background:#fff}button{cursor:pointer;background:#0f172a;color:#fff}.blue{background:#2563eb}.danger{background:#b91c1c}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#f1f5f9}.admin-order,.ad-request{margin:10px 0;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.admin-status-message{display:block;margin-top:8px;font-size:.9rem}.ad-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ad-link{word-break:break-all;color:#1d4ed8}.status{font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><strong>Soukis Admin</strong><div><select id="language" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select> <a href="index.html" id="store-link">العودة للمتجر</a></div></header>
<main>
<p id="admin-status" class="muted">جارٍ التحقق من الصلاحيات…</p>
<section id="dashboard" hidden>
<div class="grid"><div class="card"><div id="products-label" class="muted">المنتجات المعروضة</div><div id="products-count" class="value">—</div></div><div class="card"><div id="orders-label" class="muted">آخر الطلبات المحملة</div><div id="orders-count" class="value">—</div></div><div class="card"><div id="user-label" class="muted">المستخدم الحالي</div><div id="admin-email" class="value" style="font-size:16px">—</div></div></div>
<div class="panel"><h2 id="products-title">إدارة المنتجات</h2><div id="products-list" class="muted">جارٍ التحميل…</div></div>
<div class="panel"><h2 id="orders-title">إدارة الطلبات</h2><div id="orders-list" class="muted">جارٍ التحميل…</div><div id="message" class="msg" hidden></div></div>
<div class="panel"><h2 id="ads-title">إعلانات الشركات</h2><div id="ads-list" class="muted">جارٍ التحميل…</div></div>
</section>
</main>
<script type="module">
import { db } from './supabase.js';
import { getAdminOrders, updateOrderStatus } from './admin-service.js';
const status=document.getElementById('admin-status'),dashboard=document.getElementById('dashboard'),message=document.getElementById('message');
const texts={ar:{store:'العودة للمتجر',products:'المنتجات المعروضة',orders:'آخر الطلبات المحملة',user:'المستخدم الحالي',pt:'إدارة المنتجات',ot:'إدارة الطلبات',ads:'إعلانات الشركات',loading:'جارٍ التحقق من الصلاحيات…',ok:'تم التحقق من صلاحيات Admin.',denied:'تم رفض الوصول أو تعذر تحميل البيانات.',none:'لا توجد منتجات',productSaved:'تم تحديث حالة المنتج',productFail:'تعذر تحديث المنتج',adNone:'لا توجد طلبات إعلانية.',approve:'موافقة',reject:'رفض',payment:'إنشاء رابط Chargily',working:'جارٍ التنفيذ…',done:'تم إنشاء رابط الدفع.',fail:'تعذر تنفيذ العملية.',copy:'نسخ الرابط'},fr:{store:'Retour à la boutique',products:'Produits affichés',orders:'Commandes chargées',user:'Utilisateur actuel',pt:'Gestion des produits',ot:'Gestion des commandes',ads:'Publicité d’entreprise',loading:'Vérification des droits…',ok:'Droits Admin vérifiés.',denied:'Accès refusé ou données indisponibles.',none:'Aucun produit',productSaved:'Statut du produit mis à jour',productFail:'Impossible de mettre à jour le produit',adNone:'Aucune demande publicitaire.',approve:'Approuver',reject:'Rejeter',payment:'Créer le lien Chargily',working:'Traitement…',done:'Lien de paiement créé.',fail:'Opération impossible.',copy:'Copier le lien'},en:{store:'Back to the store',products:'Listed products',orders:'Loaded orders',user:'Current user',pt:'Product management',ot:'Order management',ads:'Corporate ads',loading:'Checking permissions…',ok:'Admin permissions verified.',denied:'Access denied or data unavailable.',none:'No products',productSaved:'Product status updated',productFail:'Could not update product',adNone:'No advertising requests.',approve:'Approve',reject:'Reject',payment:'Create Chargily link',working:'Working…',done:'Payment link created.',fail:'Operation failed.',copy:'Copy link'}};
const statuses=['active','sold','hidden','pending'];
const productStatusLabels={ar:{active:'نشط',sold:'مباع',hidden:'مخفي',pending:'قيد المراجعة'},fr:{active:'Actif',sold:'Vendu',hidden:'Masqué',pending:'En attente'},en:{active:'Active',sold:'Sold',hidden:'Hidden',pending:'Pending'}};
const adStatusLabels={ar:{pending:'قيد المراجعة',approved:'موافق عليه',rejected:'مرفوض',cancelled:'ملغى',active:'نشط',paid:'مدفوع'},fr:{pending:'En attente',approved:'Approuvée',rejected:'Rejetée',cancelled:'Annulée',active:'Active',paid:'Payée'},en:{pending:'Pending',approved:'Approved',rejected:'Rejected',cancelled:'Cancelled',active:'Active',paid:'Paid'}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=localStorage.getItem('soukis-language')||'ar';
function applyLang(){const t=texts[lang]||texts.ar;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').value=lang;document.getElementById('store-link').textContent=t.store;document.getElementById('products-label').textContent=t.products;document.getElementById('orders-label').textContent=t.orders;document.getElementById('user-label').textContent=t.user;document.getElementById('products-title').textContent=t.pt;document.getElementById('orders-title').textContent=t.ot;document.getElementById('ads-title').textContent=t.ads;}
function flash(text){message.textContent=text;message.hidden=false;setTimeout(()=>message.hidden=true,3000)}
async function loadProducts(){const {data,error}=await db.from('listings').select('id,title,price,currency,status,created_at').order('created_at',{ascending:false}).limit(20);if(error)throw error;document.getElementById('products-count').textContent=data?.length||0;const t=texts[lang]||texts.ar,labels=productStatusLabels[lang]||productStatusLabels.ar;document.getElementById('products-list').innerHTML=data?.length?data.map(p=>`<div class="row"><div><strong>${esc(p.title)}</strong><br><span class="muted">${esc(p.price)} ${esc(p.currency||'')}</span></div><select data-product="${esc(p.id)}" aria-label="${esc(t.pt)}: ${esc(labels[p.status]||p.status||'')}">${statuses.map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${labels[s]}</option>`).join('')}</select></div>`).join(''):t.none;document.querySelectorAll('[data-product]').forEach(el=>el.addEventListener('change',async()=>{const id=el.dataset.product,value=el.value;el.disabled=true;const {error}=await db.from('listings').update({status:value}).eq('id',id);el.disabled=false;if(error){flash(t.productFail);await loadProducts()}else flash(t.productSaved)}));}
async function loadOrders(){const result=await getAdminOrders();if(!result.ok)throw result.error||new Error('Admin access denied');document.getElementById('orders-count').textContent=result.orders.length;const labels={ar:{pending:'قيد الانتظار',confirmed:'مؤكد',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغى',none:'لا توجد طلبات'},fr:{pending:'En attente',confirmed:'Confirmée',shipped:'Expédiée',completed:'Terminée',cancelled:'Annulée',none:'Aucune commande'},en:{pending:'Pending',confirmed:'Confirmed',shipped:'Shipped',completed:'Completed',cancelled:'Cancelled',none:'No orders'}}[lang]||{};const allowed=['pending','confirmed','shipped','completed','cancelled'];document.getElementById('orders-list').innerHTML=result.orders.length?result.orders.map(o=>`<div class="admin-order" data-order="${esc(o.id)}"><strong>#${esc(o.id)}</strong><div>${esc(o.shipping_name||'—')} · ${esc(o.total)} ${esc(o.currency||'')}</div><select class="order-status" aria-label="Order status">${allowed.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${labels[s]}</option>`).join('')}</select><span class="admin-status-message" aria-live="polite"></span></div>`).join(''):labels.none;document.querySelectorAll('.order-status').forEach(el=>el.addEventListener('change',async()=>{const box=el.closest('[data-order]'),msg=box.querySelector('.admin-status-message'),id=box.dataset.order,previous=el.dataset.previous||el.value;el.disabled=true;msg.textContent=lang==='ar'?'جارٍ الحفظ…':lang==='fr'?'Enregistrement…':'Saving…';const result=await updateOrderStatus(id,el.value);el.disabled=false;if(!result.ok){el.value=previous;msg.textContent=lang==='ar'?'فشل التحديث':lang==='fr'?'Échec de la mise à jour':'Update failed'}else{el.dataset.previous=el.value;msg.textContent=lang==='ar'?'تم التحديث':lang==='fr'?'Mis à jour':'Updated'}}));document.querySelectorAll('.order-status').forEach(el=>el.dataset.previous=el.value)}
async function createCheckout(requestId,button){const t=texts[lang]||texts.ar;button.disabled=true;button.textContent=t.working;const {data,error}=await db.functions.invoke('chargily-checkout',{body:{request_id:requestId,payment_method:'edahabia'}});button.disabled=false;if(error||!data?.checkout_url){button.textContent=t.fail;return}const box=button.closest('.ad-request');const link=box?.querySelector('.ad-link');if(link){link.href=data.checkout_url;link.textContent=data.checkout_url;link.hidden=false}button.textContent=t.done}
async function reviewAd(requestId,state,button){const t=texts[lang]||texts.ar;button.disabled=true;const {error}=await db.rpc('admin_review_corporate_ad',{p_request_id:requestId,p_status:state,p_review_note:null});button.disabled=false;if(error){button.textContent=t.fail;return}await loadCorporateAds()}
async function loadCorporateAds(){const t=texts[lang]||texts.ar,labels=adStatusLabels[lang]||adStatusLabels.ar;const {data,error}=await db.rpc('admin_list_corporate_ad_requests',{p_status:null});if(error){document.getElementById('ads-list').innerHTML=`<div class="msg">${t.fail}</div>`;return}if(!data?.length){document.getElementById('ads-list').innerHTML=`<div class="msg">${t.adNone}</div>`;return}document.getElementById('ads-list').innerHTML=data.map(r=>`<article class="ad-request" data-request="${esc(r.id)}"><strong>${esc(r.company_name)} — ${esc(r.ad_title)}</strong><div>${esc(r.contact_email||'—')} · ${Number(r.amount_dzd||0).toLocaleString(lang==='ar'?'ar-DZ':lang==='fr'?'fr-DZ':'en-DZ')} DZD</div><div class="status">${labels[r.status]||esc(r.status)} · ${esc(r.plan)}</div><div class="ad-actions">${r.status==='pending'?`<button class="blue ad-approve" data-id="${esc(r.id)}">${t.approve}</button><button class="danger ad-reject" data-id="${esc(r.id)}">${t.reject}</button>`:''}${r.status==='approved'?`<button class="blue ad-payment" data-id="${esc(r.id)}">${t.payment}</button>`:''}</div><a class="ad-link" target="_blank" rel="noopener" hidden></a></article>`).join('');document.querySelectorAll('.ad-approve').forEach(b=>b.addEventListener('click',()=>reviewAd(b.dataset.id,'approved',b)));document.querySelectorAll('.ad-reject').forEach(b=>b.addEventListener('click',()=>reviewAd(b.dataset.id,'rejected',b)));document.querySelectorAll('.ad-payment').forEach(b=>b.addEventListener('click',()=>createCheckout(b.dataset.id,b)))}
async function load(){
  const results=await Promise.allSettled([loadProducts(),loadOrders(),loadCorporateAds()]);
  const failed=results.filter(r=>r.status==='rejected');
  if(failed.length) console.error('[Soukis Admin] section load failures',failed.map(r=>r.reason));
  return {ok:failed.length===0,failed:failed.length};
}
document.getElementById('language').addEventListener('change',async e=>{lang=e.target.value;localStorage.setItem('soukis-language',lang);applyLang();await load()});
applyLang();
try{const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Access denied');const {data:isAdmin,error}=await db.rpc('is_admin');if(error||isAdmin!==true)throw new Error('Access denied');document.getElementById('admin-email').textContent=user.email||'Admin';dashboard.hidden=false;status.textContent=(texts[lang]||texts.ar).ok;await load()}catch(e){status.textContent=(texts[lang]||texts.ar).denied;console.error(e)}
</script>
</body></html>
