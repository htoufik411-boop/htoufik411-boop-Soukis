<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Soukis — منصة عالمية للشراء والبيع"><meta name="theme-color" content="#0f172a"><title>Soukis — السوق العالمي</title>
<script type="module">
import { installCartBridge } from './cart-bridge.js';import { installProductsUI } from './products-ui.js';import { installSoukisIntegration } from './soukis-integration.js';import { installI18n } from './i18n.js';import { openMyProducts } from './my-products.js';import { getMyOrders, renderMyOrders } from './my-orders.js';import { initAdmin } from './admin.js';import { initAuth } from './auth.js';
window.addEventListener('DOMContentLoaded',()=>{const modal=document.getElementById('modal'),body=document.getElementById('modalBody');const openModal=html=>{body.innerHTML=html;modal.hidden=false},closeModal=()=>modal.hidden=true;document.getElementById('close')?.addEventListener('click',closeModal);installI18n();installCartBridge({buttonSelector:'.cart'});installProductsUI();installSoukisIntegration({openModal,closeModal});document.getElementById('myProductsBtn')?.addEventListener('click',()=>openMyProducts(openModal,closeModal));initAdmin();initAuth({openModal,closeModal});
const myOrdersButton=document.createElement('button');myOrdersButton.id='myOrdersBtn';myOrdersButton.className='pill';myOrdersButton.dataset.i18n='myOrders';myOrdersButton.textContent='طلباتي';document.querySelector('.userbar')?.appendChild(myOrdersButton);myOrdersButton.addEventListener('click',async()=>{const result=await getMyOrders();if(!result.ok){openModal(`<h2>${getCurrentLanguageLabel('ar','Mes commandes','My orders')}</h2><p class="msg">${getCurrentLanguageLabel('سجّل الدخول أولًا.','Connectez-vous d’abord.','Please sign in first.')}</p>`);return;}openModal(`<h2>${getCurrentLanguageLabel('طلباتي','Mes commandes','My orders')}</h2><div id="myOrdersList"></div>`);renderMyOrders(document.getElementById('myOrdersList'),result.orders);});
function getCurrentLanguageLabel(ar,fr,en){const lang=document.getElementById('lang')?.value||'ar';return lang==='fr'?fr:lang==='en'?en:ar;}
});
</script>
<style>:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#2563eb;--dark:#0f172a;--border:#e5e7eb;--shadow:0 15px 40px rgba(15,23,42,.08)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:28px;font-weight:900}.logo span{color:var(--primary)}nav{display:flex;gap:25px;font-weight:700;color:#4b5563}.actions{display:flex;gap:8px;align-items:center}select,input,textarea{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:11px 13px;outline:0}button,.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}.dark{background:var(--dark);color:#fff}.blue{background:var(--primary);color:#fff}.hero{width:90%;max-width:1200px;margin:42px auto 25px;padding:58px;border-radius:32px;background:radial-gradient(circle at 15% 20%,#3b82f655,transparent 35%),linear-gradient(135deg,#0f172a,#172554);color:#fff;display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center}.hero h1{font-size:clamp(40px,6vw,70px);line-height:1.05;margin:10px 0 20px}.hero p{color:#cbd5e1;font-size:19px;max-width:680px}.hero .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.hero .light{background:#fff;color:var(--dark)}.hero .ghost{background:#ffffff14;color:#fff;border:1px solid #ffffff30}.art{min-height:250px;border:1px solid #ffffff25;background:#ffffff0d;border-radius:28px;display:grid;place-items:center;text-align:center}.art b{font-size:90px;display:block}.search{width:90%;max-width:1200px;margin:auto;background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr 190px 160px;gap:9px;box-shadow:var(--shadow)}.search input{width:100%}.section{width:90%;max-width:1200px;margin:65px auto}.section-head{margin-bottom:22px}.section-head small{color:var(--primary);font-weight:900}.section-head h2{font-size:32px}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.cat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px 10px;text-align:center;font-weight:800}.cat i{display:block;font-style:normal;font-size:38px;margin-bottom:6px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.product{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #0f172a0a}.pic{height:185px;background:linear-gradient(135deg,#eff6ff,#eef2ff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.pic .emoji{font-size:62px}.body{padding:15px}.body small{color:var(--primary);font-weight:800}.body h3{margin:4px 0}.price{font-size:20px;font-weight:900}.loc{color:var(--muted);font-size:13px}.cart{width:100%;margin-top:12px;background:var(--dark);color:#fff}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:18px;padding:45px;text-align:center;color:var(--muted)}footer{margin-top:70px;background:var(--dark);color:#cbd5e1;text-align:center;padding:35px}.modal{position:fixed;inset:0;z-index:100;background:#0f172aa8;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.box{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:28px;position:relative}.close{position:absolute;left:14px;top:12px;background:#f1f5f9;width:38px;height:38px;padding:0;font-size:22px}.form{display:grid;gap:10px;margin-top:15px}.msg{padding:10px;border-radius:10px;background:#f1f5f9;margin-top:10px}.userbar{width:90%;max-width:1200px;margin:15px auto;display:flex;justify-content:flex-start;gap:8px;flex-wrap:wrap}.pill{background:#fff;border:1px solid var(--border);border-radius:99px;padding:7px 12px;color:var(--muted)}.admin-status{margin-top:10px;width:100%}@media(max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){header{flex-wrap:wrap}.hero{grid-template-columns:1fr;padding:35px 25px}.search{grid-template-columns:1fr}}@media(max-width:560px){nav{order:3;width:100%;justify-content:center}.hero,.search,.section,.userbar{width:94%}.cats,.products{grid-template-columns:1fr}.actions select{max-width:105px}.hero h1{font-size:42px}}</style>
</head>
<body>
<header><a class="logo" href="#">Soukis<span>•</span></a><nav><a href="#products" data-i18n="store">المتجر</a><a href="#categories" data-i18n="categories">الفئات</a></nav><div class="actions"><select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><button class="dark" id="admin" data-i18n="admin">Admin</button></div></header>
<div class="userbar"><span class="pill" id="session" data-i18n="notLogged">غير مسجل</span><button class="blue" id="authBtn" data-i18n="login">تسجيل الدخول</button><button class="dark" id="sellBtn" data-i18n="sell">+ أضف منتجاً</button><button id="myProductsBtn" data-i18n="myProducts">منتجاتي</button><button id="cartBtn" aria-label="Cart">🛒 <span id="cartCount">0</span></button></div>
<main><section class="hero"><div><small style="color:#93c5fd;font-weight:900" data-i18n="heroKicker">سوق واحد. عالم كامل.</small><h1 data-i18n="heroTitle">اكتشف ما تحب، وبِع ما تملك.</h1><p data-i18n="heroText">منصة عصرية للشراء والبيع، مفتوحة للجميع حول العالم.</p><div class="buttons"><button class="light" id="heroSell" data-i18n="sell">+ أضف منتجاً</button><a class="ghost btn" href="#products" data-i18n="explore">استكشف المنتجات</a></div></div><div class="art"><div><b>✦</b><strong>Soukis</strong><div style="color:#93c5fd">Marketplace</div></div></div></section>
<div class="search"><input id="search" data-i18n-placeholder="search" placeholder="ابحث عن منتج أو فئة..."><select id="category"><option value="" data-i18n="all">كل الفئات</option></select><select id="sort"><option value="" data-i18n="latest">الأحدث</option></select></div>
<section class="section" id="categories"><div class="section-head"><small data-i18n="catKicker">تسوق حسب الفئة</small><h2 data-i18n="catTitle">الفئات</h2></div><div class="cats" id="cats"></div></section>
<section class="section" id="products"><div class="section-head"><small data-i18n="productKicker">منتجات حقيقية</small><h2 data-i18n="productTitle">اكتشف الجديد</h2><span id="count"></span></div><div class="products" id="grid"></div></section></main>
<footer data-i18n="footer">Soukis — سوق عالمي بسيط، سريع، ومفتوح للجميع.</footer>
<div class="modal" id="modal" hidden><div class="box"><button class="close" id="close" aria-label="Close">×</button><div id="modalBody"></div><div id="admin-status" class="admin-status" aria-live="polite"></div></div></div>
</body></html>
