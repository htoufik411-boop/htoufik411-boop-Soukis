<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Soukis - منصة عالمية للشراء والبيع"><meta name="theme-color" content="#0f172a">
<title>Soukis — السوق العالمي</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#111827;--muted:#6b7280;--primary:#2563eb;--border:#e5e7eb;--dark:#0f172a;--radius:20px;--shadow:0 15px 40px rgba(15,23,42,.08)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);min-height:72px;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:28px;font-weight:900}.logo span{color:var(--primary)}nav{display:flex;gap:28px;color:#4b5563;font-weight:700}nav a:hover{color:var(--primary)}.header-actions{display:flex;gap:8px;align-items:center}select,input,textarea{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:11px 14px;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--primary)}.admin-btn{border:0;background:var(--dark);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800}
.hero{width:90%;max-width:1200px;margin:45px auto 30px;min-height:430px;padding:60px;border-radius:32px;background:radial-gradient(circle at 15% 20%,rgba(59,130,246,.35),transparent 35%),linear-gradient(135deg,#0f172a,#172554);color:#fff;display:grid;grid-template-columns:1.3fr .7fr;align-items:center;gap:50px}.eyebrow{display:inline-block;color:#93c5fd;font-weight:800;margin-bottom:10px}.hero h1{font-size:clamp(40px,6vw,72px);line-height:1.05;letter-spacing:-2px;margin-bottom:22px}.hero p{color:#cbd5e1;max-width:650px;font-size:19px}.hero-buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:13px;font-weight:800}.primary{border:0;background:#fff;color:var(--dark)}.secondary{border:1px solid rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08)}.hero-art{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);border-radius:30px;background:rgba(255,255,255,.06)}.symbol{font-size:90px}.hero-art strong{font-size:32px}.hero-art span{color:#93c5fd}
.search-box{width:90%;max-width:1200px;margin:25px auto;padding:15px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 190px 160px;gap:10px}.search-box input{width:100%}section.content{width:90%;max-width:1200px;margin:70px auto}.section-header{margin-bottom:25px}.section-header h2{font-size:32px}.section-header small{color:var(--primary);font-weight:800}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}.category{border:1px solid var(--border);background:#fff;border-radius:var(--radius);padding:25px 15px;text-align:center;transition:.2s;box-shadow:0 5px 20px rgba(15,23,42,.04)}.category:hover{transform:translateY(-4px);border-color:#bfdbfe;box-shadow:var(--shadow)}.category .icon{display:block;font-size:38px;margin-bottom:10px}.category strong{display:block}
.products-header{display:flex;align-items:end;justify-content:space-between;gap:20px}#resultCount{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.product{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.04);transition:.2s}.product:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.product-image{height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eff6ff,#eef2ff);font-size:60px;position:relative}.favorite{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff}.favorite.active{color:#e11d48}.product-body{padding:17px}.product-category{font-size:12px;color:var(--primary);font-weight:800}.product h3{margin:5px 0;font-size:18px}.product-price{font-size:20px;font-weight:900;margin-top:10px}.product-location{color:var(--muted);font-size:13px;margin-top:4px}.cart-btn{width:100%;border:0;margin-top:13px;padding:10px;border-radius:11px;background:var(--dark);color:#fff;font-weight:700}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:20px;padding:45px;text-align:center;color:var(--muted)}
footer{margin-top:80px;padding:35px 5%;background:var(--dark);color:#cbd5e1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}footer strong{color:#fff}.modal{position:fixed;inset:0;z-index:500;background:rgba(15,23,42,.65);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}.modal[hidden]{display:none}.modal-box{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:30px;position:relative}.close{position:absolute;top:12px;left:15px;border:0;background:#f1f5f9;width:38px;height:38px;border-radius:50%;font-size:24px}.form{display:grid;gap:12px}.form input,.form select,.form textarea{width:100%}.form textarea{min-height:100px;resize:vertical}.form button{border:0;background:var(--primary);color:#fff;border-radius:12px;padding:13px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{padding:16px;background:#f8fafc;border:1px solid var(--border);border-radius:14px;text-align:center}.stat strong{display:block;font-size:24px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:1000}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.categories{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){header{flex-wrap:wrap}.nav{order:3;width:100%;justify-content:center}.hero{grid-template-columns:1fr;padding:35px 25px}.search-box{grid-template-columns:1fr}}@media(max-width:560px){header{padding:10px 4%}.logo{font-size:24px}.header-actions select{max-width:105px}.admin-btn{padding:9px 12px}.hero{width:94%;margin-top:20px}.hero h1{font-size:42px}section.content{width:94%}.categories,.products{grid-template-columns:1fr}.products-header{align-items:start;flex-direction:column}.stats{grid-template-columns:1fr}}
</style></head>
<body>
<header><a href="#" class="logo">Soukis<span>•</span></a><nav><a href="#products" data-i18n="shop">المتجر</a><a href="#categories" data-i18n="categories">الفئات</a></nav><div class="header-actions"><select id="language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><button class="admin-btn" id="adminBtn">Admin</button></div></header>
<main><section class="hero"><div><span class="eyebrow" data-i18n="eyebrow">سوق واحد. عالم كامل.</span><h1 data-i18n="heroTitle">اكتشف ما تحب، وبِع ما تملك.</h1><p data-i18n="heroText">منصة عصرية للشراء والبيع، مفتوحة للجميع حول العالم.</p><div class="hero-buttons"><button class="primary" id="sellBtn" data-i18n="sell">+ أضف منتجاً</button><a class="secondary" href="#products" data-i18n="explore">استكشف المنتجات</a></div></div><div class="hero-art"><div class="symbol">✦</div><strong>Soukis</strong><span>Marketplace</span></div></section>
<div class="search-box"><input id="searchInput" type="search" data-i18n-placeholder="search" placeholder="ابحث عن منتج أو فئة..."><select id="categoryFilter"></select><select id="sortFilter"></select></div>
<section class="content" id="categories"><div class="section-header"><small data-i18n="shopBy">تسوق حسب الفئة</small><h2 data-i18n="categoriesTitle">الفئات</h2></div><div class="categories" id="categoriesGrid"></div></section>
<section class="content" id="products"><div class="section-header products-header"><div><small data-i18n="featured">منتجات مختارة</small><h2 data-i18n="discover">اكتشف الجديد</h2></div><span id="resultCount"></span></div><div id="productsGrid" class="products"></div></section></main>
<footer><strong>Soukis</strong><span data-i18n="footer">— سوق عالمي بسيط، سريع، ومفتوح للجميع.</span></footer>
<div class="modal" id="modal" hidden><div class="modal-box"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div><div id="toast"></div>
<script>
const cats=[['electronics','⚡'],['fashion','✦'],['home','⌂'],['sports','◈'],['vehicles','🚗'],['services','💼']];
const products=[
{id:1,name:{ar:'هاتف ذكي فاخر',fr:'Smartphone premium',en:'Premium Smartphone'},cat:'electronics',price:499,icon:'📱'},
{id:2,name:{ar:'سماعات لاسلكية',fr:'Casque sans fil',en:'Wireless Headphones'},cat:'electronics',price:89,icon:'🎧'},
{id:3,name:{ar:'سترة عصرية',fr:'Veste moderne',en:'Modern Jacket'},cat:'fashion',price:75,icon:'🧥'},
{id:4,name:{ar:'أحذية أنيقة',fr:'Chaussures de créateur',en:'Designer Shoes'},cat:'fashion',price:120,icon:'👟'},
{id:5,name:{ar:'كرسي عصري',fr:'Chaise moderne',en:'Modern Chair'},cat:'home',price:145,icon:'🪑'},
{id:6,name:{ar:'مصباح ذكي',fr:'Lampe intelligente',en:'Smart Lamp'},cat:'home',price:49,icon:'💡'},
{id:7,name:{ar:'كرة قدم',fr:'Ballon de football',en:'Football'},cat:'sports',price:35,icon:'⚽'},
{id:8,name:{ar:'ساعة لياقة',fr:'Montre fitness',en:'Fitness Watch'},cat:'sports',price:99,icon:'⌚'},
{id:9,name:{ar:'سيارة عائلية',fr:'Voiture familiale',en:'Family Car'},cat:'vehicles',price:18500,icon:'🚙'},
{id:10,name:{ar:'تصميم مواقع',fr:'Création de sites',en:'Web Design'},cat:'services',price:300,icon:'💻'}];
const tr={ar:{shop:'المتجر',categories:'الفئات',eyebrow:'سوق واحد. عالم كامل.',heroTitle:'اكتشف ما تحب، وبِع ما تملك.',heroText:'منصة عصرية للشراء والبيع، مفتوحة للجميع حول العالم.',sell:'+ أضف منتجاً',explore:'استكشف المنتجات',search:'ابحث عن منتج أو فئة...',all:'كل الفئات',newest:'الأحدث',low:'السعر: الأقل',high:'السعر: الأعلى',shopBy:'تسوق حسب الفئة',categoriesTitle:'الفئات',featured:'منتجات مختارة',discover:'اكتشف الجديد',footer:'— سوق عالمي بسيط، سريع، ومفتوح للجميع.',results:'منتجات',add:'أضف إلى السلة',admin:'لوحة الإدارة',adminText:'لوحة الإدارة جاهزة للربط مع Supabase.',sellTitle:'أضف منتجاً',name:'اسم المنتج',price:'السعر',description:'وصف المنتج',publish:'نشر المنتج',fav:'المفضلة',cart:'السلة',no:'لا توجد منتجات مطابقة.',added:'تمت إضافة المنتج إلى السلة.',cats:{electronics:'إلكترونيات',fashion:'أزياء',home:'المنزل',sports:'رياضة',vehicles:'مركبات',services:'خدمات'}},fr:{shop:'Boutique',categories:'Catégories',eyebrow:'Un marché. Un monde.',heroTitle:'Découvrez ce que vous aimez et vendez ce que vous avez.',heroText:'Une marketplace moderne ouverte aux acheteurs et vendeurs du monde entier.',sell:'+ Ajouter un produit',explore:'Explorer les produits',search:'Rechercher un produit ou une catégorie...',all:'Toutes les catégories',newest:'Plus récents',low:'Prix : croissant',high:'Prix : décroissant',shopBy:'Acheter par catégorie',categoriesTitle:'Catégories',featured:'Produits sélectionnés',discover:'Découvrez les nouveautés',footer:'— Une marketplace simple, rapide et ouverte à tous.',results:'produits',add:'Ajouter au panier',admin:'Administration',adminText:"Le panneau d'administration est prêt pour Supabase.",sellTitle:'Ajouter un produit',name:'Nom du produit',price:'Prix',description:'Description',publish:'Publier',fav:'Favoris',cart:'Panier',no:'Aucun produit trouvé.',added:'Produit ajouté au panier.',cats:{electronics:'Électronique',fashion:'Mode',home:'Maison',sports:'Sport',vehicles:'Véhicules',services:'Services'}},en:{shop:'Shop',categories:'Categories',eyebrow:'One marketplace. A whole world.',heroTitle:'Discover what you love. Sell what you have.',heroText:'A modern marketplace open to buyers and sellers worldwide.',sell:'+ Add a product',explore:'Explore products',search:'Search for a product or category...',all:'All categories',newest:'Newest',low:'Price: low to high',high:'Price: high to low',shopBy:'Shop by category',categoriesTitle:'Categories',featured:'Featured products',discover:"Discover what's new",footer:'— A simple, fast marketplace open to everyone.',results:'products',add:'Add to cart',admin:'Admin Panel',adminText:'The admin panel is ready for Supabase integration.',sellTitle:'Add a product',name:'Product name',price:'Price',description:'Description',publish:'Publish',fav:'Favorites',cart:'Cart',no:'No matching products.',added:'Product added to cart.',cats:{electronics:'Electronics',fashion:'Fashion',home:'Home',sports:'Sports',vehicles:'Vehicles',services:'Services'}}};
let lang=localStorage.getItem('soukisLanguage')||'ar',fav=JSON.parse(localStorage.getItem('soukisFavorites')||'[]'),cart=JSON.parse(localStorage.getItem('soukisCart')||'[]');const t=k=>tr[lang][k]||k;const cn=k=>tr[lang].cats[k];
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));filters();categories();render()}
function filters(){let c=document.getElementById('categoryFilter'),s=document.getElementById('sortFilter'),cv=c.value||'all',sv=s.value||'newest';c.innerHTML='<option value="all">'+t('all')+'</option>'+cats.map(x=>'<option value="'+x[0]+'">'+cn(x[0])+'</option>').join('');s.innerHTML='<option value="newest">'+t('newest')+'</option><option value="low">'+t('low')+'</option><option value="high">'+t('high')+'</option>';c.value=cats.some(x=>x[0]===cv)?cv:'all';s.value=['newest','low','high'].includes(sv)?sv:'newest'}
function categories(){document.getElementById('categoriesGrid').innerHTML=cats.map(x=>'<button class="category" data-cat="'+x[0]+'"><span class="icon">'+x[1]+'</span><strong>'+cn(x[0])+'</strong></button>').join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{document.getElementById('categoryFilter').value=b.dataset.cat;render();document.getElementById('products').scrollIntoView({behavior:'smooth'})})}
function render(){let q=document.getElementById('searchInput').value.toLowerCase().trim(),c=document.getElementById('categoryFilter').value,s=document.getElementById('sortFilter').value,r=products.filter(p=>(c==='all'||p.cat===c)&&(!q||(p.name.ar+' '+p.name.fr+' '+p.name.en+' '+cn(p.cat)).toLowerCase().includes(q)));if(s==='low')r.sort((a,b)=>a.price-b.price);if(s==='high')r.sort((a,b)=>b.price-a.price);document.getElementById('productsGrid').innerHTML=r.length?r.map(p=>'<article class="product"><div class="product-image"><button class="favorite '+(fav.includes(p.id)?'active':'')+'" data-f="'+p.id+'">♥</button>'+p.icon+'</div><div class="product-body"><div class="product-category">'+cn(p.cat)+'</div><h3>'+p.name[lang]+'</h3><div class="product-price">$'+p.price.toLocaleString()+'</div><div class="product-location">🌍 Global</div><button class="cart-btn" data-c="'+p.id+'">'+t('add')+'</button></div></article>').join(''):'<div class="empty">'+t('no')+'</div>';document.getElementById('resultCount').textContent=r.length+' '+t('results');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let id=+b.dataset.f;fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];localStorage.setItem('soukisFavorites',JSON.stringify(fav));render()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cart.push(+b.dataset.c);localStorage.setItem('soukisCart',JSON.stringify(cart));toast(t('added'))})}
function toast(m){let x=document.getElementById('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),2500)}function modal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').hidden=false}function close(){document.getElementById('modal').hidden=true}
document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('soukisLanguage',lang);apply()};document.getElementById('searchInput').oninput=render;document.getElementById('categoryFilter').onchange=render;document.getElementById('sortFilter').onchange=render;document.getElementById('sellBtn').onclick=()=>{modal('<h2>'+t('sellTitle')+'</h2><form class="form" id="sellForm"><input required placeholder="'+t('name')+'"><input required type="number" min="0" placeholder="'+t('price')+'"><select>'+cats.map(x=>'<option>'+cn(x[0])+'</option>').join('')+'</select><textarea placeholder="'+t('description')+'"></textarea><button>'+t('publish')+'</button></form>');document.getElementById('sellForm').onsubmit=e=>{e.preventDefault();toast(t('published')||'Ready');close()}};document.getElementById('adminBtn').onclick=()=>modal('<h2>'+t('admin')+'</h2><p style="color:#6b7280;margin-top:10px">'+t('adminText')+'</p><div class="stats"><div class="stat"><span>'+t('results')+'</span><strong>'+products.length+'</strong></div><div class="stat"><span>'+t('fav')+'</span><strong>'+fav.length+'</strong></div><div class="stat"><span>'+t('cart')+'</span><strong>'+cart.length+'</strong></div></div>');document.getElementById('closeModal').onclick=close;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')close()};apply();
</script></body></html>
