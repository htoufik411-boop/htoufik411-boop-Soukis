<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Soukis — منصة عالمية للشراء والبيع"><meta name="theme-color" content="#0f172a">
<title>Soukis — السوق العالمي</title>
<script type="module">
import { installCartBridge } from './cart-bridge.js';
window.addEventListener('DOMContentLoaded',()=>installCartBridge({buttonSelector:'.cart'}));
</script>
<style>:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#2563eb;--dark:#0f172a;--border:#e5e7eb;--radius:20px;--shadow:0 15px 40px rgba(15,23,42,.08)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:28px;font-weight:900}.logo span{color:var(--primary)}nav{display:flex;gap:25px;font-weight:700;color:#4b5563}.actions{display:flex;gap:8px;align-items:center}select,input,textarea{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:11px 13px;outline:0}button,.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}.dark{background:var(--dark);color:#fff}.blue{background:var(--primary);color:#fff}.hero{width:90%;max-width:1200px;margin:42px auto 25px;padding:58px;border-radius:32px;background:radial-gradient(circle at 15% 20%,#3b82f655,transparent 35%),linear-gradient(135deg,#0f172a,#172554);color:#fff;display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center}.hero h1{font-size:clamp(40px,6vw,70px);line-height:1.05;margin:10px 0 20px}.hero p{color:#cbd5e1;font-size:19px;max-width:680px}.hero .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.hero .light{background:#fff;color:var(--dark)}.hero .ghost{background:#ffffff14;color:#fff;border:1px solid #ffffff30}.art{min-height:250px;border:1px solid #ffffff25;background:#ffffff0d;border-radius:28px;display:grid;place-items:center;text-align:center}.art b{font-size:90px;display:block}.search{width:90%;max-width:1200px;margin:auto;background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr 190px 160px;gap:9px;box-shadow:var(--shadow)}.search input{width:100%}.section{width:90%;max-width:1200px;margin:65px auto}.section-head{margin-bottom:22px}.section-head small{color:var(--primary);font-weight:900}.section-head h2{font-size:32px}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.cat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px 10px;text-align:center;font-weight:800}.cat i{display:block;font-style:normal;font-size:38px;margin-bottom:6px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.product{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #0f172a0a}.pic{height:185px;background:linear-gradient(135deg,#eff6ff,#eef2ff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.pic .emoji{font-size:62px}.fav{position:absolute;top:10px;left:10px;width:38px;height:38px;padding:0;background:#fff;border:1px solid var(--border)}.fav.active{color:#e11d48}.body{padding:15px}.body small{color:var(--primary);font-weight:800}.body h3{margin:4px 0}.price{font-size:20px;font-weight:900}.loc{color:var(--muted);font-size:13px}.cart{width:100%;margin-top:12px;background:var(--dark);color:#fff}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:18px;padding:45px;text-align:center;color:var(--muted)}footer{margin-top:70px;background:var(--dark);color:#cbd5e1;text-align:center;padding:35px}.modal{position:fixed;inset:0;z-index:100;background:#0f172aa8;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.box{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:28px;position:relative}.close{position:absolute;left:14px;top:12px;background:#f1f5f9;width:38px;height:38px;padding:0;font-size:22px}.form{display:grid;gap:10px;margin-top:15px}.form input,.form select,.form textarea{width:100%}.form textarea{min-height:100px}.msg{padding:10px;border-radius:10px;background:#f1f5f9;margin-top:10px}.userbar{width:90%;max-width:1200px;margin:15px auto;display:flex;justify-content:flex-start;gap:8px;flex-wrap:wrap}.pill{background:#fff;border:1px solid var(--border);border-radius:99px;padding:7px 12px;color:var(--muted)}@media(max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){header{flex-wrap:wrap}.hero{grid-template-columns:1fr;padding:35px 25px}.search{grid-template-columns:1fr}}@media(max-width:560px){nav{order:3;width:100%;justify-content:center}.hero,.search,.section,.userbar{width:94%}.cats,.products{grid-template-columns:1fr}.actions select{max-width:105px}.hero h1{font-size:42px}}</style>
</head>
<body>
<header><a class="logo" href="#">Soukis<span>•</span></a><nav><a href="#products" data-t="shop">المتجر</a><a href="#categories" data-t="categories">الفئات</a></nav><div class="actions"><select id="lang"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><button class="dark" id="admin">Admin</button></div></header>
<div class="userbar"><span class="pill" id="session">غير مسجل</span><button class="blue" id="authBtn">تسجيل الدخول</button><button class="dark" id="sellBtn">+ أضف منتجاً</button><button id="cartBtn">🛒 <span id="cartCount">0</span></button></div>
<main><section class="hero"><div><small style="color:#93c5fd;font-weight:900" data-t="eyebrow">سوق واحد. عالم كامل.</small><h1 data-t="heroTitle">اكتشف ما تحب، وبِع ما تملك.</h1><p data-t="heroText">منصة عصرية للشراء والبيع، مفتوحة للجميع حول العالم.</p><div class="buttons"><button class="light" id="heroSell" data-t="sell">+ أضف منتجاً</button><a class="ghost btn" href="#products" data-t="explore">استكشف المنتجات</a></div></div><div class="art"><div><b>✦</b><strong>Soukis</strong><div style="color:#93c5fd">Marketplace</div></div></div></section>
<div class="search"><input id="search" data-tp="search" placeholder="ابحث عن منتج أو فئة..."><select id="category"></select><select id="sort"></select></div>
<section class="section" id="categories"><div class="section-head"><small data-t="shopBy">تسوق حسب الفئة</small><h2 data-t="categoriesTitle">الفئات</h2></div><div class="cats" id="cats"></div></section>
<section class="section" id="products"><div class="section-head"><small data-t="featured">منتجات حقيقية</small><h2 data-t="discover">اكتشف الجديد</h2><span id="count"></span></div><div class="products" id="grid"></div></section></main>
<footer><strong>Soukis</strong> <span data-t="footer">— سوق عالمي بسيط، سريع، ومفتوح للجميع.</span></footer>
<div class="modal" id="modal" hidden><div class="box"><button class="close" id="close">×</button><div id="modalBody"></div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://cqkhzzkcffhanyanavvw.supabase.co';const SUPABASE_KEY='sb_publishable_7rdabmz_vTemmUxme-XHBg_cVdnWzOS';const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const icons={electronics:'⚡',fashion:'✦',home:'⌂',sports:'⚽',vehicles:'🚗',services:'💼'};
const translations={ar:{shop:'المتجر',categories:'الفئات',eyebrow:'سوق واحد. عالم كامل.',heroTitle:'اكتشف ما تحب، وبِع ما تملك.',heroText:'منصة عصرية للشراء والبيع، مفتوحة للجميع حول العالم.',sell:'+ أضف منتجاً',explore:'استكشف المنتجات',search:'ابحث عن منتج أو فئة...',all:'كل الفئات',newest:'الأحدث',low:'السعر: الأقل',high:'السعر: الأعلى',shopBy:'تسوق حسب الفئة',categoriesTitle:'الفئات',featured:'منتجات حقيقية',discover:'اكتشف الجديد',footer:'— سوق عالمي بسيط، سريع، ومفتوح للجميع.',login:'تسجيل الدخول',logout:'تسجيل الخروج',signup:'إنشاء حساب',email:'البريد الإلكتروني',password:'كلمة المرور',name:'اسم المنتج',price:'السعر',description:'الوصف',category:'الفئة',location:'الموقع',image:'رابط الصورة',publish:'نشر المنتج',cart:'السلة',add:'أضف إلى السلة',added:'تمت الإضافة إلى السلة',empty:'لا توجد منتجات حالياً.',adminText:'لوحة الإدارة',myProducts:'منتجاتي',authError:'تعذر تنفيذ العملية.',welcome:'مرحباً',cats:{electronics:'إلكترونيات',fashion:'أزياء',home:'المنزل',sports:'رياضة',vehicles:'مركبات',services:'خدمات'}},fr:{shop:'Boutique',categories:'Catégories',eyebrow:'Un marché. Un monde.',heroTitle:'Découvrez ce que vous aimez et vendez ce que vous avez.',heroText:'Une marketplace moderne ouverte au monde.',sell:'+ Ajouter un produit',explore:'Explorer',search:'Rechercher...',all:'Toutes les catégories',newest:'Plus récents',low:'Prix croissant',high:'Prix décroissant',shopBy:'Acheter par catégorie',categoriesTitle:'Catégories',featured:'Produits réels',discover:'Découvrez les nouveautés',footer:'— Une marketplace simple et ouverte à tous.',login:'Connexion',logout:'Déconnexion',signup:'Créer un compte',email:'Email',password:'Mot de passe',name:'Nom du produit',price:'Prix',description:'Description',category:'Catégorie',location:'Localisation',image:'URL image',publish:'Publier',cart:'Panier',add:'Ajouter au panier',added:'Ajouté au panier',empty:'Aucun produit pour le moment.',adminText:'Administration',myProducts:'Mes produits',authError:'Opération impossible.',welcome:'Bienvenue',cats:{electronics:'Électronique',fashion:'Mode',home:'Maison',sports:'Sport',vehicles:'Véhicules',services:'Services'}},en:{shop:'Shop',categories:'Categories',eyebrow:'One market. One world.',heroTitle:'Discover what you love and sell what you have.',heroText:'A modern marketplace open to everyone worldwide.',sell:'+ Add product',explore:'Explore products',search:'Search products...',all:'All categories',newest:'Newest',low:'Price: low to high',high:'Price: high to low',shopBy:'Shop by category',categoriesTitle:'Categories',featured:'Live products',discover:'Discover what is new',footer:'— A simple, fast marketplace open to everyone.',login:'Sign in',logout:'Sign out',signup:'Create account',email:'Email',password:'Password',name:'Product name',price:'Price',description:'Description',category:'Category',location:'Location',image:'Image URL',publish:'Publish product',cart:'Cart',add:'Add to cart',added:'Added to cart',empty:'No products yet.',adminText:'Admin panel',myProducts:'My products',authError:'Operation failed.',welcome:'Welcome',cats:{electronics:'Electronics',fashion:'Fashion',home:'Home',sports:'Sports',vehicles:'Vehicles',services:'Services'}}};
let lang=localStorage.getItem('sou kis-lang')||localStorage.getItem('sou kis_lang')||'ar';if(!translations[lang])lang='ar';let products=[];let favorites=JSON.parse(localStorage.getItem('sou kis-fav')||'[]');let cart=JSON.parse(localStorage.getItem('sou kis-cart')||'[]');let currentUser=null;
const $=id=>document.getElementById(id),t=()=>translations[lang];function save(){localStorage.setItem('sou kis-fav',JSON.stringify(favorites));localStorage.setItem('sou kis-cart',JSON.stringify(cart));$('cartCount').textContent=cart.length}function toast(x){const el=document.createElement('div');el.textContent=x;el.style='position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:12px 18px;border-radius:12px;z-index:300';document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
async function supaAddToCart(id){if(!currentUser){toast(t().login);authModal();return false}const {data:existing}=await db.from('cart_items').select('id,quantity').eq('user_id',currentUser.id).eq('listing_id',id).maybeSingle();if(existing){const {error}=await db.from('cart_items').update({quantity:Number(existing.quantity)+1}).eq('id',existing.id);if(error){toast(t().authError);return false}}else{const {error}=await db.from('cart_items').insert({user_id:currentUser.id,listing_id:id,quantity:1});if(error){toast(t().authError);return false}}const {count}=await db.from('cart_items').select('*',{count:'exact',head:true}).eq('user_id',currentUser.id);$('cartCount').textContent=String(count||0);toast(t().added);return true}
function addCart(id){supaAddToCart(id)}
async function loadCartCount(){if(!currentUser){$('cartCount').textContent='0';return}const {data}=await db.from('cart_items').select('quantity').eq('user_id',currentUser.id);$('cartCount').textContent=String((data||[]).reduce((n,x)=>n+Number(x.quantity||0),0))}
function applyI18n(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t()[e.dataset.t]||e.textContent);document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t()[e.dataset.tp]||e.placeholder);$('lang').value=lang;$('authBtn').textContent=currentUser?t().logout:t().login;$('sellBtn').textContent=t().sell;$('heroSell').textContent=t().sell;buildFilters();renderCats();renderProducts()}
function buildFilters(){const c=$('category');c.innerHTML=`<option value="">${t().all}</option>`+Object.entries(t().cats).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('sort').innerHTML=`<option value="new">${t().newest}</option><option value="low">${t().low}</option><option value="high">${t().high}</option>`}
function renderCats(){ $('cats').innerHTML=Object.entries(t().cats).map(([k,v])=>`<button class="cat" onclick="document.getElementById('category').value='${k}';renderProducts()"><i>${icons[k]}</i>${v}</button>`).join('') }
function renderProducts(){const q=$('search').value.toLowerCase(),cat=$('category').value,sort=$('sort').value;let a=products.filter(p=>(!q||`${p.title||p.name||''} ${p.category||''} ${p.location||''}`.toLowerCase().includes(q))&&(!cat||p.category===cat));a.sort((x,y)=>sort==='low'?Number(x.price)-Number(y.price):sort==='high'?Number(y.price)-Number(x.price):new Date(y.created_at)-new Date(x.created_at));$('count').textContent=`${a.length}`;$('grid').innerHTML=a.length?a.map(p=>{const title=p.title||p.name||'Soukis';return `<article class="product"><div class="pic">${p.image_url?`<img src="${p.image_url}" alt="">`:`<span class="emoji">${icons[p.category]||'✦'}</span>`}</div><div class="body"><small>${t().cats[p.category]||p.category||''}</small><h3>${escapeHtml(title)}</h3><div class="price">${Number(p.price||0).toLocaleString('fr-DZ')} DA</div><div class="loc">${escapeHtml(p.location||'')}</div><button class="cart" data-listing-id="${p.id}">${t().add}</button></div></article>`}).join(''):`<div class="empty">${t().empty}</div>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const {data,error}=await db.from('listings').select('*').order('created_at',{ascending:false});products=data||[];if(error)toast(t().authError);renderProducts()}
function close(){ $('modal').hidden=true }
function authModal(){ $('modal').hidden=false;$('modalBody').innerHTML=`<h2>${t().login}</h2><form class="form" id="authForm"><input id="email" type="email" placeholder="${t().email}" required><input id="password" type="password" placeholder="${t().password}" required><button class="blue">${t().login}</button></form><button id="signup" style="margin-top:10px">${t().signup}</button>`;$('authForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)toast(error.message);else close()};$('signup').onclick=async()=>{const {error}=await db.auth.signUp({email:$('email').value,password:$('password').value});toast(error?error.message:t().welcome)}}
async function cartModal(){if(!currentUser){authModal();return}$('modal').hidden=false;const {data,error}=await db.from('cart_items').select('id,listing_id,quantity,listings(*)').eq('user_id',currentUser.id);if(error){$('modalBody').textContent=t().authError;return}const items=data||[];$('modalBody').innerHTML=`<h2>${t().cart}</h2>${items.length?items.map(x=>{const p=Array.isArray(x.listings)?x.listings[0]:x.listings;return `<div class="msg"><strong>${escapeHtml(p?.title||p?.name||'')}</strong><br>${Number(p?.price||0).toLocaleString('fr-DZ')} DA × ${x.quantity}</div>`}).join(''):`<div class="msg">${t().empty}</div>`}`}
$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('sou kis-lang',lang);applyI18n()};$('search').oninput=renderProducts;$('category').onchange=renderProducts;$('sort').onchange=renderProducts;$('authBtn').onclick=()=>currentUser?db.auth.signOut():authModal();$('cartBtn').onclick=cartModal;$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('sellBtn').onclick=()=>toast('Sell modal ready');$('heroSell').onclick=()=>toast('Sell modal ready');$('admin').onclick=()=>toast(t().adminText);document.addEventListener('click',e=>{const b=e.target.closest('.cart');if(b){e.preventDefault();e.stopImmediatePropagation();addCart(b.dataset.listingId)}} ,true);db.auth.onAuthStateChange((_,s)=>{currentUser=s?.user||null;$('session').textContent=currentUser?currentUser.email:'غير مسجل';applyI18n();loadCartCount()});applyI18n();load();save();
</script>
</body></html>
