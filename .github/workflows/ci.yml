name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f admin.html
          test -f admin.js
          test -f auth.js
          test -f app-config.js
          test -d supabase
          test -d supabase/migrations
          echo "Soukis repository structure OK"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done
          echo "JavaScript syntax OK"

      - name: Validate SQL migration files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            test -s "$file"
          done < <(find supabase/migrations -type f -name '*.sql' -print0)
          test "$found" -eq 1
          echo "SQL migration files OK"
