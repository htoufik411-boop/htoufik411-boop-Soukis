name: Soukis validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Soukis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required entrypoints
        run: |
          set -euo pipefail
          for f in index.html admin.html app-config.js; do test -f "$f" || exit 1; done
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)
      - name: Validate local module references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,sys
          from urllib.parse import urlsplit
          roots=[pathlib.Path('index.html'),*pathlib.Path('.').glob('*.js')]
          refs=[]
          for file in roots:
              text=file.read_text(encoding='utf-8')
              refs += [(file, r) for r in re.findall(r"(?:from|import\()\s*['\"](\./[^'\"]+)['\"]", text)]
          missing=[]
          for source,ref in refs:
              path=pathlib.Path(urlsplit(ref).path.lstrip('./'))
              if not path.is_file(): missing.append(f'{source}: {ref}')
          if missing: print('\n'.join(missing)); sys.exit(1)
          PY
      - name: Validate HTML shell
        run: |
          set -euo pipefail
          grep -q '<html lang="ar" dir="rtl">' index.html
          grep -q 'id="lang"' index.html
          grep -q 'id="cartBtn"' index.html
          grep -q 'id="admin"' index.html
          grep -q 'id="grid"' index.html
      - name: Check for committed secrets
        run: |
          set -euo pipefail
          if git grep -nE 'sb_secret_[A-Za-z0-9._-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' -- ':!.github/workflows/validate.yml'; then exit 1; fi
      - name: Run Chargily contract tests
        run: node scripts/validate-chargily.mjs
