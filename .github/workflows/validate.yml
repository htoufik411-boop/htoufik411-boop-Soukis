name: Soukis validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Soukis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html admin.html app-config.js; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          test "${#files[@]}" -gt 0 || { echo "No JavaScript files found"; exit 1; }
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Validate local modules imported by the main page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          from urllib.parse import urlsplit
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          imports = re.findall(r"from\s+['\"](\./[^'\"]+)['\"]", html)
          missing = [ref for ref in imports if not pathlib.Path(urlsplit(ref).path.lstrip("./")).is_file()]
          if missing:
              print("Missing local modules:"); print("\n".join(missing)); sys.exit(1)
          PY

      - name: Validate HTML shell
        run: |
          set -euo pipefail
          grep -q '<html lang="ar" dir="rtl">' index.html
          grep -q 'id="lang"' index.html
          grep -q 'id="cartBtn"' index.html
          grep -q 'id="admin"' index.html
          grep -q 'id="grid"' index.html

      - name: Check for forbidden Supabase service-role credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|service_role[[:space:]]*['"'"']?[=:]' -- ':!.github/workflows/validate.yml'; then
            echo "Forbidden server-side Supabase credential pattern detected."
            exit 1
          fi

      - name: Run Chargily contract tests
        run: node scripts/validate-chargily.mjs
